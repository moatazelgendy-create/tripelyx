AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Tripelyx private preview (stack tripelyx-preview). One small Amazon Lightsail container service with its
  own address, a generated preview password in Secrets Manager, a registry for preview images, and a
  GitHub role that only the development branch can use. It shares nothing with tripelyx.com: no load
  balancer, ECS, RDS or DNS of the live site is used or changed. Deployed to by
  .github/workflows/preview.yml. Delete this stack to remove all of it.

Parameters:
  GitHubOwner:
    Type: String
    Default: moatazelgendy-create
  GitHubRepo:
    Type: String
    Default: tripelyx
  GitHubOwnerId:
    Type: String
    Default: '335752477'
    Description: Numeric GitHub account ID (newer repos put it in the OIDC subject).
  GitHubRepoId:
    Type: String
    Default: '1405020835'
    Description: Numeric GitHub repository ID (newer repos put it in the OIDC subject).

Resources:
  # The Lightsail service: power micro (1 GB, 0.25 vCPU), one node. No deployment is described here; the
  # workflow creates each one, so the stack never fights the workflow over which version runs. The ECR
  # image puller role lets it pull from the private repository below.
  PreviewService:
    Type: AWS::Lightsail::Container
    Properties:
      ServiceName: tripelyx-preview
      Power: micro
      Scale: 1
      PrivateRegistryAccess:
        EcrImagePullerRole:
          IsActive: true
      Tags:
        - { Key: project, Value: tripelyx-preview }

  # Preview images only (production images live in the tripelyx repository of tripelyx-bootstrap). The
  # policy names the Lightsail service's puller role; the service does not refer to the repository, so
  # there is no circular dependency: the service is created first, then this repository.
  PreviewRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: tripelyx-preview
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Keep the last 5 preview images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},
          "action":{"type":"expire"}}]}
      RepositoryPolicyText:
        Version: '2012-10-17'
        Statement:
          - Sid: LightsailPreviewPull
            Effect: Allow
            Principal:
              AWS: !GetAtt PreviewService.PrivateRegistryAccess.EcrImagePullerRole.PrincipalArn
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer

  # The preview password, generated by Secrets Manager: 24 letters and digits, no look-alike characters.
  # It is never in the repository, the image or the workflow logs; the workflow reads it at deploy time.
  PreviewPassword:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: tripelyx-preview/password
      Description: Password for the Tripelyx private preview (HTTP Basic auth, any user name).
      GenerateSecretString:
        PasswordLength: 24
        ExcludePunctuation: true
        ExcludeCharacters: 'Il1O0o'
        RequireEachIncludedType: true
      Tags:
        - { Key: project, Value: tripelyx-preview }

  # GitHub Actions on the development branch only (never main, which deploys tripelyx.com with its own role).
  # Least privilege: push to the preview repository, read the preview password, deploy to and read the
  # preview service. It cannot touch CloudFormation, ECS, RDS, the load balancer, DNS or the main registry.
  GitHubPreviewRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tripelyx-github-preview
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              # The account's existing GitHub identity provider, created by tripelyx-bootstrap.
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # GitHub sends one of these two subject formats; both name this repo's development branch only.
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOwner}/${GitHubRepo}:ref:refs/heads/claude/travel-by-budget-uv85qf
                  - !Sub repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:ref:refs/heads/claude/travel-by-budget-uv85qf
      Policies:
        - PolicyName: deploy-tripelyx-preview
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: EcrPushPreviewImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt PreviewRepository.Arn
              - Sid: ReadPreviewPassword
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref PreviewPassword
              - Sid: DeployPreviewService
                Effect: Allow
                Action: lightsail:CreateContainerServiceDeployment
                Resource: !GetAtt PreviewService.ContainerArn
              # These Lightsail reads take no resource ARN (Resource must be '*').
              - Sid: ReadPreviewService
                Effect: Allow
                Action:
                  - lightsail:GetContainerServices
                  - lightsail:GetContainerServiceDeployments
                  - lightsail:GetContainerLog
                Resource: '*'

Outputs:
  PreviewRoleArn:
    Description: The role .github/workflows/preview.yml uses (its default; the PREVIEW_ROLE_ARN variable overrides it).
    Value: !GetAtt GitHubPreviewRole.Arn
  ServiceName:
    Value: tripelyx-preview
  Url:
    Description: The preview's address. It answers once the first deployment is active.
    Value: !GetAtt PreviewService.Url
  RepositoryUri:
    Value: !GetAtt PreviewRepository.RepositoryUri
  PasswordSecretName:
    Description: Read the password with aws secretsmanager get-secret-value (see README, Private preview).
    Value: tripelyx-preview/password

AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Tripelyx web app on AWS: ECS Fargate behind an Application Load Balancer, with its own
  PostgreSQL database (RDS). One stack per environment (tripelyx-staging, tripelyx-production).
  Deployed by .github/workflows/deploy.yml.

Parameters:
  AppEnv:
    Type: String
    AllowedValues: [staging, production]
    Default: staging
  ImageUri:
    Type: String
    Description: Container image to run (set by the deploy workflow).
  DesiredCount:
    Type: Number
    Default: 1
  CertificateArn:
    Type: String
    Default: ''
    Description: Optional ACM certificate ARN for HTTPS on your own domain. Leave empty for HTTP only.
  PaymentMode:
    Type: String
    AllowedValues: [test, live]
    Default: test
  AllowDemoInventory:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
  DbInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: db.t4g.micro is not offered for Postgres 17 in every region (for example us-east-1).

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]
  IsProduction: !Equals [!Ref AppEnv, production]

Resources:
  # ---------- Network: 2 public subnets (load balancer, app) and 2 private subnets (database) ----------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.40.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub 'tripelyx-${AppEnv}' }]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway }
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable }
  PublicSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable }

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public web traffic to the load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App containers; only the load balancer can reach them
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 4100, ToPort: 4100, SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup }
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Database; only the app containers can reach it
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref AppSecurityGroup }

  # ---------- Database: private, encrypted, password kept in Secrets Manager by RDS ----------
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for the Tripelyx database
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
  Database:
    Type: AWS::RDS::DBInstance
    Metadata:
      cfn-lint:
        config:
          # A major version alone ('17') lets RDS pick the current minor release; the linter only knows exact minors.
          ignore_checks: [W3691]
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: '17'
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      DBName: tripelyx
      MasterUsername: tripelyx
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: !If [IsProduction, true, false]
      BackupRetentionPeriod: !If [IsProduction, 14, 3]
      DeletionProtection: !If [IsProduction, true, false]
      AutoMinorVersionUpgrade: true

  # ---------- Containers ----------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub 'tripelyx-${AppEnv}'
      ClusterSettings: [{ Name: containerInsights, Value: disabled }]
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/tripelyx/${AppEnv}'
      RetentionInDays: 30
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-database-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt Database.MasterUserSecret.SecretArn
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub 'tripelyx-${AppEnv}'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      RuntimePlatform: { OperatingSystemFamily: LINUX, CpuArchitecture: X86_64 }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: web
          Image: !Ref ImageUri
          Essential: true
          PortMappings: [{ ContainerPort: 4100, Protocol: tcp }]
          Environment:
            - { Name: APP_ENV, Value: !Ref AppEnv }
            - { Name: PORT, Value: '4100' }
            - { Name: TRUST_PROXY, Value: 'true' }
            - { Name: PAYMENT_MODE, Value: !Ref PaymentMode }
            - { Name: ALLOW_DEMO_INVENTORY, Value: !Ref AllowDemoInventory }
            - { Name: DATABASE_ENV, Value: !Ref AppEnv }
            - { Name: DATABASE_HOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: DATABASE_PORT, Value: !GetAtt Database.Endpoint.Port }
            - { Name: DATABASE_NAME, Value: tripelyx }
            - { Name: DATABASE_SSL, Value: 'true' }
            - { Name: DATABASE_SSL_CA_FILE, Value: /app/certs/rds-global-bundle.pem }
          Secrets:
            - { Name: DATABASE_USER, ValueFrom: !Sub '${Database.MasterUserSecret.SecretArn}:username::' }
            - { Name: DATABASE_PASSWORD, ValueFrom: !Sub '${Database.MasterUserSecret.SecretArn}:password::' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web

  # ---------- Load balancer ----------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 4100
      TargetType: ip
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '20' }
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions: !If
        - HasCertificate
        - - Type: redirect
            RedirectConfig: { Protocol: HTTPS, Port: '443', StatusCode: HTTP_301 }
        - - Type: forward
            TargetGroupArn: !Ref TargetGroup
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref TargetGroup }]

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      ServiceName: web
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
          SecurityGroups: [!Ref AppSecurityGroup]
      LoadBalancers:
        - { ContainerName: web, ContainerPort: 4100, TargetGroupArn: !Ref TargetGroup }

Outputs:
  SiteUrl:
    Description: The site's address (point your domain here with a CNAME).
    Value: !Sub
      - '${Scheme}://${LoadBalancer.DNSName}'
      - { Scheme: !If [HasCertificate, https, http] }
  LogGroup:
    Value: !Ref LogGroup

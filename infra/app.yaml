AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Tripelyx web app on AWS: ECS Fargate behind an Application Load Balancer, with its own
  PostgreSQL database (RDS). One stack per environment (tripelyx-staging, tripelyx-production).
  Deployed by .github/workflows/deploy.yml.

Parameters:
  AppEnv:
    Type: String
    AllowedValues: [staging, production]
    Default: staging
  ImageUri:
    Type: String
    Description: Container image to run (set by the deploy workflow).
  DesiredCount:
    Type: Number
    Default: 1
  CertificateArn:
    Type: String
    Default: ''
    Description: Optional ACM certificate ARN for HTTPS on your own domain. Leave empty for HTTP only.
  PaymentMode:
    Type: String
    AllowedValues: [test, live]
    Default: test
  AllowDemoInventory:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
  AdminEmails:
    Type: String
    Default: ''
    Description: Comma-separated emails of the accounts allowed into the admin control center (/admin).
  EnableTrips:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Serve the Travel by Budget planner as the homepage.
  EnableBusiness:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Tripelyx Business company travel workspaces at /business (works with EnableTrips on or off). Off unless set to 'true'.
  PublicBaseUrl:
    Type: String
    Default: ''
    Description: Canonical site address, e.g. https://www.tripelyx.com (used for canonical links and the sitemap).
  DbInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: db.t4g.micro is not offered for Postgres 17 in every region (for example us-east-1).
  ProtectDatabase:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: >-
      Deletion protection and 14 days of automated backups on the database, in every environment
      (www.tripelyx.com runs on the staging stack). Set 'false' only to delete a stack on purpose.

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]
  IsProduction: !Equals [!Ref AppEnv, production]
  Protected: !Or [!Condition IsProduction, !Equals [!Ref ProtectDatabase, 'true']]

Resources:
  # ---------- Network: 2 public subnets (load balancer, app) and 2 private subnets (database) ----------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.40.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub 'tripelyx-${AppEnv}' }]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway }
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable }
  PublicSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable }

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public web traffic to the load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App containers; only the load balancer can reach them
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 4100, ToPort: 4100, SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup }
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Database; only the app containers can reach it
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref AppSecurityGroup }

  # ---------- Database: private, encrypted, password kept in Secrets Manager by RDS ----------
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for the Tripelyx database
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
  Database:
    Type: AWS::RDS::DBInstance
    Metadata:
      cfn-lint:
        config:
          # A major version alone ('17') lets RDS pick the current minor release; the linter only knows exact minors.
          ignore_checks: [W3691]
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: '17'
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      DBName: tripelyx
      MasterUsername: tripelyx
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: !If [IsProduction, true, false]
      # Both change in place, never by replacement: DeletionProtection "Update requires: No interruption";
      # BackupRetentionPeriod "Some interruptions", which RDS only has between 0 and a nonzero value (3 to 14 has none).
      BackupRetentionPeriod: !If [Protected, 14, 3]
      DeletionProtection: !If [Protected, true, false]
      AutoMinorVersionUpgrade: true

  # ---------- Containers ----------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub 'tripelyx-${AppEnv}'
      ClusterSettings: [{ Name: containerInsights, Value: disabled }]
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/tripelyx/${AppEnv}'
      RetentionInDays: 30

  # ---------- Business supplier keys (live search) ----------
  # Created with the placeholder "unset", which the app reads as "not set": Business has no supplier until the
  # owner pastes a key over it in the AWS console (README "Pasting a supplier key"). A pasted value survives
  # later deploys because SecretString below never changes; never edit it, or a deploy would put "unset" back.
  # RetainExceptOnCreate: a rolled-back first create removes them (no fixed-name orphan blocks the next deploy),
  # and once they exist they are kept. The admin task definition maps neither.
  DuffelTokenSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'tripelyx-${AppEnv}/business/duffel-token'
      Description: Duffel live access token for Tripelyx Business search. "unset" means not set.
      SecretString: unset
  LiteApiKeySecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'tripelyx-${AppEnv}/business/liteapi-key'
      Description: LiteAPI production key for Tripelyx Business search. "unset" means not set.
      SecretString: unset
  # Only the site's execution role may read either value. The owner's own console identity is not named
  # here yet (it is not known from the template), so reading the value in the console is refused too;
  # writing a new value (PutSecretValue) is not, and neither is changing this policy.
  DuffelTokenSecretPolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      SecretId: !Ref DuffelTokenSecret
      BlockPublicPolicy: true
      ResourcePolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: OnlyTheSiteReadsTheKey
            Effect: Deny
            Principal: '*'
            Action: secretsmanager:GetSecretValue
            Resource: '*'
            Condition:
              ArnNotEquals:
                aws:PrincipalArn: !GetAtt ExecutionRole.Arn
  LiteApiKeySecretPolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      SecretId: !Ref LiteApiKeySecret
      BlockPublicPolicy: true
      ResourcePolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: OnlyTheSiteReadsTheKey
            Effect: Deny
            Principal: '*'
            Action: secretsmanager:GetSecretValue
            Resource: '*'
            Condition:
              ArnNotEquals:
                aws:PrincipalArn: !GetAtt ExecutionRole.Arn
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-database-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt Database.MasterUserSecret.SecretArn
              - Sid: ReadSupplierKeys
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref DuffelTokenSecret, !Ref LiteApiKeySecret]
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub 'tripelyx-${AppEnv}'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      RuntimePlatform: { OperatingSystemFamily: LINUX, CpuArchitecture: X86_64 }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: web
          Image: !Ref ImageUri
          Essential: true
          PortMappings: [{ ContainerPort: 4100, Protocol: tcp }]
          Environment:
            - { Name: APP_ENV, Value: !Ref AppEnv }
            - { Name: PORT, Value: '4100' }
            - { Name: TRUST_PROXY, Value: 'true' }
            - { Name: HTTPS_ONLY, Value: !If [HasCertificate, 'true', 'false'] }
            - { Name: PAYMENT_MODE, Value: !Ref PaymentMode }
            - { Name: ALLOW_DEMO_INVENTORY, Value: !Ref AllowDemoInventory }
            - { Name: ENABLE_TRIPS, Value: !Ref EnableTrips }
            - { Name: ENABLE_BUSINESS, Value: !Ref EnableBusiness }
            # Business's own demo flights and hotels: never on this site (ALLOW_DEMO_INVENTORY stays for /book).
            - { Name: BUSINESS_DEMO_INVENTORY, Value: 'false' }
            # Business live search: live keys only, never supplier test data. While either key reads "unset"
            # Business has no supplier, and live search stays off until a platform admin turns it on.
            - { Name: BUSINESS_FLIGHT_SUPPLIER, Value: duffel }
            - { Name: BUSINESS_HOTEL_SUPPLIER, Value: liteapi }
            - { Name: BUSINESS_SUPPLIER_LIVE, Value: 'true' }
            - { Name: BUSINESS_ALLOW_SUPPLIER_TEST, Value: 'false' }
            - { Name: ADMIN_EMAILS, Value: !Ref AdminEmails }
            - { Name: PUBLIC_BASE_URL, Value: !Ref PublicBaseUrl }
            - { Name: DATABASE_ENV, Value: !Ref AppEnv }
            - { Name: DATABASE_HOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: DATABASE_PORT, Value: !GetAtt Database.Endpoint.Port }
            - { Name: DATABASE_NAME, Value: tripelyx }
            - { Name: DATABASE_SSL, Value: 'true' }
            - { Name: DATABASE_SSL_CA_FILE, Value: /app/certs/rds-global-bundle.pem }
          Secrets:
            - { Name: DATABASE_USER, ValueFrom: !Sub '${Database.MasterUserSecret.SecretArn}:username::' }
            - { Name: DATABASE_PASSWORD, ValueFrom: !Sub '${Database.MasterUserSecret.SecretArn}:password::' }
            - { Name: DUFFEL_ACCESS_TOKEN, ValueFrom: !Ref DuffelTokenSecret }
            - { Name: LITEAPI_API_KEY, ValueFrom: !Ref LiteApiKeySecret }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web

  # ---------- One-off admin tasks (scripts/platform-admin.js) ----------
  # Run with ecs run-task on the web service's network configuration; nothing runs it on a schedule.
  # It gets the database and nothing else: no other secret, no task role (so no AWS credentials), and an
  # execution role that can pull the image, read the database secret and write only its own log streams.
  AdminExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: run-admin-task
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: PullAppImage
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/tripelyx'
              - Sid: WriteAdminLogStreams
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogGroup}:log-stream:admin/*'
              - Sid: ReadDatabaseSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt Database.MasterUserSecret.SecretArn
  AdminTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub 'tripelyx-${AppEnv}-admin'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      RuntimePlatform: { OperatingSystemFamily: LINUX, CpuArchitecture: X86_64 }
      ExecutionRoleArn: !GetAtt AdminExecutionRole.Arn
      ContainerDefinitions:
        - Name: admin
          Image: !Ref ImageUri
          Essential: true
          Command: [node, scripts/platform-admin.js, list]
          Environment:
            - { Name: APP_ENV, Value: !Ref AppEnv }
            - { Name: ADMIN_EMAILS, Value: !Ref AdminEmails }
            - { Name: DATABASE_ENV, Value: !Ref AppEnv }
            - { Name: DATABASE_HOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: DATABASE_PORT, Value: !GetAtt Database.Endpoint.Port }
            - { Name: DATABASE_NAME, Value: tripelyx }
            - { Name: DATABASE_SSL, Value: 'true' }
            - { Name: DATABASE_SSL_CA_FILE, Value: /app/certs/rds-global-bundle.pem }
          Secrets:
            - { Name: DATABASE_USER, ValueFrom: !Sub '${Database.MasterUserSecret.SecretArn}:username::' }
            - { Name: DATABASE_PASSWORD, ValueFrom: !Sub '${Database.MasterUserSecret.SecretArn}:password::' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: admin

  # ---------- Load balancer ----------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 4100
      TargetType: ip
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '20' }
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions: !If
        - HasCertificate
        - - Type: redirect
            RedirectConfig: { Protocol: HTTPS, Port: '443', StatusCode: HTTP_301 }
        - - Type: forward
            TargetGroupArn: !Ref TargetGroup
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref TargetGroup }]

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      ServiceName: web
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
          SecurityGroups: [!Ref AppSecurityGroup]
      LoadBalancers:
        - { ContainerName: web, ContainerPort: 4100, TargetGroupArn: !Ref TargetGroup }

Outputs:
  SiteUrl:
    Description: The site's address (point your domain here with a CNAME).
    Value: !Sub
      - '${Scheme}://${LoadBalancer.DNSName}'
      - { Scheme: !If [HasCertificate, https, http] }
  LogGroup:
    Value: !Ref LogGroup
